# Database Configuration
# You can adjust these to point to your local MySQL 8.0 instance:
db.type=auto
db.mysql.url=jdbc:mysql://localhost:3306/helpdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.user=root
db.mysql.password=root
db.mysql.driver=com.mysql.cj.jdbc.Driver

# Embedded Fallback Mode (H2 in MySQL compatibility mode)
# Automatically used if MySQL connection fails or credentials differ
db.h2.url=jdbc:h2:mem:helpdesk_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
db.h2.user=sa
db.h2.password=
db.h2.driver=org.h2.Driver
